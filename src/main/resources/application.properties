
# ==========================================
# APPLICATION CONFIGURATION
# ==========================================

spring.application.name=StudentPlacementManagement
server.port=8080


# ==========================================
# MYSQL DATABASE CONFIGURATION
# ==========================================

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/student_placement_management?useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true}

spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# ==========================================
# HIKARI CONNECTION POOL
# ==========================================

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000


# ==========================================
# JPA / HIBERNATE CONFIGURATION
# ==========================================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false


# ==========================================
# JWT SECURITY CONFIGURATION
# ==========================================

application.security.jwt.secret-key=${JWT_SECRET}
application.security.jwt.expiration=86400000


# ==========================================
# VALIDATION CONFIGURATION
# ==========================================

spring.mvc.problemdetails.enabled=true


# ==========================================
# LOGGING CONFIGURATION
# ==========================================

logging.level.root=INFO
logging.level.com.kshem=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=DEBUG

# Enable only when debugging SQL parameter values.
# Avoid using TRACE in production.
# logging.level.org.hibernate.orm.jdbc.bind=TRACE


# ==========================================
# SPRINGDOC / SWAGGER CONFIGURATION
# ==========================================

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha


# ==========================================
# JACKSON JSON CONFIGURATION
# ==========================================

spring.jackson.datatype.datetime.write-dates-as-timestamps=false
spring.jackson.time-zone=Asia/Kolkata


# ==========================================
# ADMIN ACCOUNT INITIALIZATION
# ==========================================

app.admin.username=${ADMIN_USERNAME}
app.admin.email=${ADMIN_EMAIL}
app.admin.password=${ADMIN_PASSWORD}
